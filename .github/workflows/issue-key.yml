name: Key registry

# Issue or withdraw an access key from anywhere, including a phone.
# Only the fingerprint travels through this workflow — never the key itself —
# so nothing sensitive ever lands in a public run log.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        required: true
        default: issue
        options: [issue, withdraw]
      fingerprint:
        description: The 32-character fingerprint from the key generator
        type: string
        required: true
      expires:
        description: Expiry date, YYYY-MM-DD (issue only)
        type: string
        required: false
      reference:
        description: Public reference, e.g. SC-0007 (issue only)
        type: string
        required: false

permissions:
  contents: write

# Two key runs at once used to race each other into a push rejection.
# Queue them instead.
concurrency:
  group: key-registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the updater
        run: |
          cat > "$RUNNER_TEMP/update_keys.py" <<'PY'
          import json, os, re, sys, datetime

          action = os.environ["ACTION"]
          fp = os.environ["FP"].strip().lower()
          expires = os.environ.get("EXPIRES", "").strip()
          ref = os.environ.get("REFERENCE", "").strip()
          today = datetime.date.today()

          if not re.fullmatch(r"[0-9a-f]{32}", fp):
              sys.exit("Fingerprint must be exactly 32 hex characters. "
                       "Use the 'Copy fingerprint' button in the key generator.")

          with open("keys.json") as f:
              reg = json.load(f)
          keys = reg.get("keys", [])

          cutoff = (today - datetime.timedelta(days=30)).isoformat()
          before = len(keys)
          keys = [k for k in keys if k.get("expires", "") >= cutoff]
          pruned = before - len(keys)

          if action == "withdraw":
              remaining = [k for k in keys if k.get("fp") != fp]
              if len(remaining) == len(keys):
                  sys.exit("That fingerprint is not on the list. Nothing to withdraw.")
              keys = remaining
              summary = "withdraw " + fp[:8]
          else:
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", expires):
                  sys.exit("Issuing needs an expiry date in YYYY-MM-DD form.")
              if datetime.date.fromisoformat(expires) < today:
                  sys.exit(expires + " has already passed. Pick a future date.")
              if any(k.get("fp") == fp for k in keys):
                  print("Already published. Nothing to do.")
                  open(os.environ["SUMMARY_FILE"], "w").write("")
                  raise SystemExit(0)
              keys.append({"fp": fp, "expires": expires, "label": ref or fp[:6].upper()})
              summary = "issue " + (ref or fp[:6].upper()) + " until " + expires

          keys.sort(key=lambda k: (k["expires"], k["fp"]))
          with open("keys.json", "w") as f:
              json.dump({"version": 1, "updated": today.isoformat(), "keys": keys}, f, indent=2)
              f.write("\n")

          if pruned:
              summary += " (pruned " + str(pruned) + " long-expired)"
          open(os.environ["SUMMARY_FILE"], "w").write(summary)
          print(summary + " - " + str(len(keys)) + " key(s) now live")
          PY

      - name: Publish, retrying if the remote moves under us
        env:
          ACTION: ${{ inputs.action }}
          FP: ${{ inputs.fingerprint }}
          EXPIRES: ${{ inputs.expires }}
          REFERENCE: ${{ inputs.reference }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export SUMMARY_FILE="$RUNNER_TEMP/summary.txt"

          for attempt in 1 2 3 4 5; do
            # Start from whatever is actually on the remote right now.
            git fetch origin main --quiet
            git reset --hard origin/main --quiet

            python3 "$RUNNER_TEMP/update_keys.py" || exit 1

            SUMMARY="$(cat "$SUMMARY_FILE")"
            if [ -z "$SUMMARY" ]; then
              echo "Nothing to change."
              echo "SUMMARY=already published" >> "$GITHUB_ENV"
              exit 0
            fi

            if git diff --quiet keys.json; then
              echo "keys.json unchanged."
              echo "SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
              exit 0
            fi

            git add keys.json
            git commit -m "keys: $SUMMARY" --quiet

            if git push origin HEAD:main --quiet; then
              echo "Published on attempt $attempt."
              echo "SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Remote moved while we worked. Retrying ($attempt of 5)."
            sleep $((attempt * 3))
          done

          echo "::error::Could not publish after 5 attempts. The key was NOT published — run this again."
          exit 1

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Published: ${SUMMARY:-done}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Live within about a minute." >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat keys.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### The key was NOT published" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Nothing changed. Run the workflow again with the same fingerprint." >> $GITHUB_STEP_SUMMARY
          fi
